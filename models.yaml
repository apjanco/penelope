# SOC Analysis — Model Configuration
#
# Define one or more LLM profiles to run the same text through.
# Results from all models are combined in the output with a "model_label"
# column so you can compare classifications side-by-side.
#
# Each entry needs:
#   label      — short name used in output columns and filenames
#   base_url   — OpenAI-compatible API endpoint
#   model_name — model identifier sent in the API request
#   api_key    — API key (or reference an env var with ${ENV_VAR_NAME})
#
# Optional:
#   temperature — override default 0.1; use null for models that
#                 reject custom temperature (e.g. GPT-5)

models:
  - label: gpt-5.4
    base_url: https://api.openai.com/v1
    model_name: gpt-5.4
    api_key: ${OPENAI_API_KEY}
    temperature: null  # GPT-5 only supports default temperature
    
  - label: mercury-2
    base_url: https://api.inceptionlabs.ai/v1
    model_name: mercury-2
    api_key: ${INCEPTION_API_KEY}

  - label: qwen3-max
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    model_name: qwen3-max
    api_key: ${DASHSCOPE_API_KEY}

  # Local vLLM readers (technique_v_genre/serve_vllm.slurm). base_url is
  # tied to whatever compute node SLURM assigned this job — re-check
  # technique_v_genre/endpoints/<served_name>.txt and update here each time
  # the server job is resubmitted (job restarts land on a different node).
  - label: qwen3-reasoning
    base_url: http://localhost:8000/v1   # job 12590291 (local vLLM, see technique_v_genre/serve_score_model.slurm)
    model_name: qwen3-reasoning
    api_key: not-needed

  - label: qwen3.6-local
    base_url: http://localhost:8000/v1
    model_name: qwen3.6-local
    api_key: not-needed

  - label: mistral
    base_url: http://localhost:8000/v1   # job 12590292 (local vLLM, see technique_v_genre/serve_score_model.slurm)
    model_name: mistral
    api_key: not-needed

  - label: llama
    base_url: http://localhost:8000/v1   # job 14787262 (local vLLM, see technique_v_genre/serve_score_model.slurm)
    model_name: llama
    api_key: not-needed

  - label: gemma
    base_url: http://localhost:8000/v1
    model_name: gemma
    api_key: not-needed

  # Example: local model via Ollama / vLLM
  # - label: qwen3-8b
  #   base_url: http://localhost:11434/v1
  #   model_name: qwen3:8b
  #   api_key: not-needed

# Chunking defaults (can still be overridden by CLI flags)
chunk_size: 20000
chunk_overlap: 1000
